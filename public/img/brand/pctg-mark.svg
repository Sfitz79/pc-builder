<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PCTechGuy Online">
  <defs>
    <linearGradient id="pctgRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#pctgRed)"/>

  <!-- Tower case silhouette -->
  <path d="M150 150 h150 a20 20 0 0 1 20 20 v212 a20 20 0 0 1 -20 20 h-150 a20 20 0 0 1 -20 -20 v-212 a20 20 0 0 1 20 -20 z"
        fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>

  <!-- GPU bar inside the case -->
  <rect x="166" y="286" width="150" height="26" rx="8" fill="#ffffff"/>

  <!-- PCIe / board slots -->
  <rect x="166" y="222" width="118" height="16" rx="8" fill="#ffffff" opacity="0.85"/>

  <!-- Power button + LED -->
  <circle cx="352" cy="196" r="13" fill="#ffffff"/>

  <!-- Speed ticks: the "gamer's edge" -->
